<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🚀 Smart Task Manager</h2>

    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Enter task">
        <button class="btn btn-success" onclick="addTask()">Add</button>
    </div>

    <div class="mb-3 text-center">
        <button class="btn btn-outline-light btn-sm" onclick="loadTasks()">All</button>
        <button class="btn btn-outline-success btn-sm" onclick="filterTasks(true)">Completed</button>
        <button class="btn btn-outline-warning btn-sm" onclick="filterTasks(false)">Pending</button>
    </div>

    <ul id="taskList" class="list-group"></ul>
</div>

<script>
    const API = "http://localhost:8080/tasks";
    let allTasks = [];

    function loadTasks() {
        fetch(API)
        .then(res => res.json())
        .then(data => {
            allTasks = data;
            displayTasks(data);
        });
    }

    function displayTasks(tasks) {
        const list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach(task => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";

            li.innerHTML = `
                <span style="text-decoration:${task.completed ? 'line-through' : 'none'}">
                    ${task.name}
                </span>

                <div>
                    <button class="btn btn-sm btn-success" onclick="toggleTask(${task.id}, ${task.completed})">
                        ✔
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">
                        ✖
                    </button>
                </div>
            `;

            list.appendChild(li);
        });
    }

    function addTask() {
        const input = document.getElementById("taskInput");

        fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: input.value, completed: false })
        }).then(() => {
            input.value = "";
            loadTasks();
        });
    }

    function deleteTask(id) {
        fetch(API + "/" + id, { method: "DELETE" })
        .then(loadTasks);
    }

    function toggleTask(id, status) {
        fetch(API + "/" + id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ completed: !status })
        }).then(loadTasks);
    }

    function filterTasks(status) {
        const filtered = allTasks.filter(t => t.completed === status);
        displayTasks(filtered);
    }

    loadTasks();
</script>

</body>
</html>
